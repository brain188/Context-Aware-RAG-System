name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fakeredis ruff black pydantic pydantic-settings pymupdf qdrant-client tokenizers huggingface_hub httpx fastapi sse-starlette redis anthropic==0.46.0 google-genai==1.75.0 tenacity==9.1.4

      - name: Ruff (lint + import order)
        run: ruff check .

      - name: Black (format check)
        run: black --check --line-length 100 app pipeline tests evaluation frontend

      - name: Pytest
        env:
          GEMINI_API_KEY: test-key-for-ci
        run: pytest -q

      # CI has no books, index, or API key, so it cannot run the eval itself. Reports
      # are run locally and committed; this fails if the newest one regressed against
      # the one before it (and passes while fewer than two exist).
      - name: Eval regression gate (committed reports)
        env:
          GEMINI_API_KEY: test-key-for-ci
        run: python -m evaluation.compare --latest
