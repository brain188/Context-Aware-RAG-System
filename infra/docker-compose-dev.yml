# Local dev backing services: vector store + cache, plus the API behind a profile.
# Usage (from repo root):
#   docker compose -f infra/docker-compose-dev.yml up -d                  # Qdrant + Redis
#   docker compose -f infra/docker-compose-dev.yml --profile app up -d    # + API with hot reload
name: rag-dev

services:
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: app/Dockerfile
    container_name: rag-api
    env_file: .env
    environment:
      # Service names, not localhost, inside the compose network.
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ../app:/srv/app:ro            # hot reload from the working tree
      - ../data:/srv/data             # query log
      - hf_cache:/home/app/.cache/huggingface   # keep downloaded models across rebuilds
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/srv/app"]
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  qdrant:
    # >= v1.16 required (parameterized RRF in hybrid queries); keep in step with qdrant-client.
    image: qdrant/qdrant:v1.18.0
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST — matches QDRANT_URL
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      # No QDRANT__SERVICE__API_KEY in dev: Qdrant >= 1.10 treats an empty key as
      # "auth on", while the app sends no key when QDRANT_API_KEY is blank.
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # Qdrant images ship no curl/wget; use the bundled binary's TCP listener check.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"   # matches REDIS_URL
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  qdrant_storage:
  redis_data:
  hf_cache:
