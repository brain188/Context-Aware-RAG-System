# Local dev backing services: vector store + cache.
# Usage (from repo root):
#   docker compose -f infra/docker-compose-dev.yml up -d
name: rag-dev

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST — matches QDRANT_URL
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # Qdrant images ship no curl/wget; use the bundled binary's TCP listener check.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"   # matches REDIS_URL
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  qdrant_storage:
  redis_data:
