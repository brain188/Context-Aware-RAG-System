version: "3.9"

# Run ingestion and its dependencies independently of the runtime app.
# Usage: docker compose -f pipeline/docker-compose.pipeline.yml up

services:
  qdrant:
    # >= v1.16 required (parameterized RRF in hybrid queries); keep in step with qdrant-client.
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_pipeline_data:/qdrant/storage
    healthcheck:
      # Qdrant images ship no curl/wget; use bash's TCP check instead.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingest:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.pipeline
    env_file:
      - ../infra/.env
    volumes:
      - ${BOOKS_DIR:-../books}:/books:ro   # mount your PDF library here
    depends_on:
      qdrant:
        condition: service_healthy
    command: >
      python -m pipeline.ingest
      --path /books
    profiles:
      - run  # start with: docker compose ... --profile run up

volumes:
  qdrant_pipeline_data:
